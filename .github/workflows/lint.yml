name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Ruff Lint Check
        uses: astral-sh/ruff-action@v3
        with:
          version: "latest"

      - name: Run Ruff Format Check
        uses: astral-sh/ruff-action@v3
        with:
          version: "latest"
          args: 'format --check'
