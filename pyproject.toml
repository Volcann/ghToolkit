[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghtoolkit"
version = "0.1.0"
description = "A GitHub CLI facade for commits, pull requests, reviews, and preserved diffs"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["requests>=2.28.0"]

[tool.setuptools]
packages = [
    "ghtoolkit",
    "ghtoolkit.audit",
    "ghtoolkit.client",
    "ghtoolkit.commit",
    "ghtoolkit.core",
    "ghtoolkit.issues",
    "ghtoolkit.models",
    "ghtoolkit.pull_request",
    "ghtoolkit.storage",
]

[tool.setuptools.package-dir]
ghtoolkit = "src"

[tool.setuptools.package-data]
ghtoolkit = ["py.typed"]
