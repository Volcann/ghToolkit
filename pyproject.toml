[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghtoolkit"
version = "0.1.0"
description = "A GitHub CLI facade for commits, pull requests, reviews, and preserved diffs"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[tool.setuptools]
packages = ["ghtoolkit", "ghtoolkit.commit", "ghtoolkit.issues", "ghtoolkit.pr", "ghtoolkit.pull_request"]

[tool.setuptools.package-dir]
ghtoolkit = "src"

[tool.setuptools.package-data]
ghtoolkit = ["py.typed"]
